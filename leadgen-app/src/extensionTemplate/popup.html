<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12100e;
      color: #f2ede6;
      width: 240px;
      padding: 16px;
      margin: 0;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #33302b;
      font-size: 13px;
    }
    .stat-value { font-weight: 600; }
    a.dashboard-link {
      display: block;
      margin-top: 14px;
      text-align: center;
      background: #ff6a3d;
      color: #1a1310;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    #msg { font-size: 12px; color: #e8646f; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Xeven Lead MailTracker</h1>
  <div id="stats">
    <div class="stat-row"><span>Sent</span><span class="stat-value" id="p-sent">—</span></div>
    <div class="stat-row"><span>Opened</span><span class="stat-value" id="p-opened">—</span></div>
    <div class="stat-row"><span>Open rate</span><span class="stat-value" id="p-rate">—</span></div>
  </div>
  <p id="msg"></p>
  <a class="dashboard-link" id="dashboard-link" href="#" target="_blank">Open dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
