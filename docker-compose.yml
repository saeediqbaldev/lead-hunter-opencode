services:
  leadgen-app:
    build: ./leadgen-app
    # No host port binding: Coolify's proxy routes your assigned domain to
    # the container on port 3000 internally. This avoids conflicts with any
    # other process already bound to host port 3000 (e.g. the previous
    # lead-hunter deployment).
    expose:
      - '3000'
    volumes:
      - './leadgen-app/data:/app/data'
    environment:
      - 'SESSION_SECRET=${SESSION_SECRET}'
      - 'SCRAPER_SERVICE_URL=http://scraper:8000'
      - 'SCRAPER_API_SECRET=${SCRAPER_API_SECRET}'
      - 'GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}'
      - DAILY_LEAD_CAP=100
      - 'OPENCODE_URL=http://opencode:4096'
      - 'OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}'
      - 'OPENCODE_MODEL=${OPENCODE_MODEL:-deepseek/deepseek-v4-flash}'
    depends_on:
      - scraper
      - opencode
    restart: unless-stopped

  scraper:
    build: ./scraper-service
    volumes:
      - './scraper-service/data:/app/data'
    environment:
      - 'SCRAPER_API_SECRET=${SCRAPER_API_SECRET}'
    restart: unless-stopped

  # OpenCode agent server (https://opencode.ai) - headless HTTP API that
  # the leadgen-app uses as an AI provider. It runs the model named by
  # OPENCODE_MODEL on leadgen-app (default deepseek/deepseek-v4-flash so it
  # serves as the fallback once Groq's daily token budget is spent). The
  # model's API key must be present HERE, in THIS container's environment:
  # a key set only on leadgen-app does NOT reach the opencode process. So
  # DEEPSEEK_API_KEY (for the default model) - or the key for whichever
  # provider OPENCODE_MODEL names - must be configured on this service in
  # Coolify too. No keys are ever stored in the app.
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command: serve --hostname 0.0.0.0 --port 4096
    environment:
      - 'GROQ_API_KEY=${GROQ_API_KEY}'
      - 'DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}'
      - 'OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}'
    restart: unless-stopped
